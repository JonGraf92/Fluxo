# Identidade própria da v2 (ADR D-041): instala ao lado do Fluxo antigo, sem substituí-lo.
appId: com.fluxo.app.v2
productName: Fluxo
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
extraMetadata:
  main: dist-electron/electron/main/index.js
  # Nome do pacote empacotado: define a pasta de instalação (Programs\fluxo-v2).
  name: fluxo-v2
mac:
  category: public.app-category.finance
  target: [dmg]
win:
  target: [nsis]
linux:
  target: [AppImage]
  category: Finance
asar: true
